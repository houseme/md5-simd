name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to crates.io after all checks (dispatch on a version tag)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Keep this group distinct from the reusable CI and Audit workflow groups.
concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match tag to Cargo.toml
        id: metadata
        run: python3 .github/scripts/release_metadata.py
      - name: Require a commit from main history
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"

  tests:
    name: Release CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  audit:
    name: Release audit
    needs: validate
    uses: ./.github/workflows/audit.yml

  candidate:
    name: Build release candidate
    needs: [validate, tests, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the crate archive
        run: cargo package --locked
      - name: Verify the crate archive path
        env:
          CRATE_NAME: ${{ needs.validate.outputs.name }}
          CRATE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          archive="target/package/${CRATE_NAME}-${CRATE_VERSION}.crate"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null
      - name: Registry publication rehearsal
        run: cargo publish --locked --registry crates-io --dry-run
      - name: Retain the verified crate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.validate.outputs.name }}-${{ needs.validate.outputs.version }}
          path: target/package/${{ needs.validate.outputs.name }}-${{ needs.validate.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to crates.io
    needs: [validate, candidate]
    # Tag pushes only produce candidates. Upload requires an explicit dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the validated source revision
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
        run: |
          if [ -z "$CARGO_REGISTRIES_CRATES_IO_TOKEN" ]; then
            echo "Configure CARGO_REGISTRY_TOKEN in the crates-io environment." >&2
            exit 1
          fi
          cargo publish --locked --registry crates-io
