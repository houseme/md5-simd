name: Audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit-0.22.2
          cache-bin: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      # Scan the checked-in lockfile, including development dependencies.
      # Refresh RustSec on every run so new advisories affect unchanged code.
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock --deny warnings
